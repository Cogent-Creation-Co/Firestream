[workspace]
resolver = "2"

# Default member - this makes 'cargo run' at the root run firestream
default-members = ["src/lib/rust/firestream"]

members = [
    # Main crates
    "src/lib/rust/firestream",
    "src/app/firestream-tui",

    # API Server
    "src/lib/rust/firestream-api-server/cli",
    "src/lib/rust/firestream-api-server/config",
    "src/lib/rust/firestream-api-server/db",
    "src/lib/rust/firestream-api-server/web",
    "src/lib/rust/firestream-api-server/macros",

    # Infrastructure crates (flattened)
    "src/lib/rust/docker-manager",
    "src/lib/rust/filesystem-manager",
    "src/lib/rust/firestream-charts",
    "src/lib/rust/firestream-e2e-core",
    "src/lib/rust/firestream-e2e-k8s",
    "src/lib/rust/firestream-healthd",
    "src/lib/rust/firestream-metadata",
    "src/lib/rust/firestream-vib",
    "src/lib/rust/helm-manager",
    "src/lib/rust/k8s-manager",
    "src/lib/rust/nix-container-builder",
    "src/lib/rust/templatizer",
    "src/lib/rust/wait-for-port",
    "src/lib/rust/workspace-embed",
]

[workspace.dependencies]
# Internal Crates
firestream = { path = "src/lib/rust/firestream" }
firestream-tui = { path = "src/app/firestream-tui" }
docker-manager = { path = "src/lib/rust/docker-manager" }
filesystem-manager = { path = "src/lib/rust/filesystem-manager" }
firestream-charts = { path = "src/lib/rust/firestream-charts" }
firestream-e2e-core = { path = "src/lib/rust/firestream-e2e-core" }
firestream-e2e-k8s = { path = "src/lib/rust/firestream-e2e-k8s" }
firestream-healthd = { path = "src/lib/rust/firestream-healthd" }
firestream-metadata = { path = "src/lib/rust/firestream-metadata" }
firestream-vib = { path = "src/lib/rust/firestream-vib" }
helm-manager = { path = "src/lib/rust/helm-manager" }
k8s-manager = { path = "src/lib/rust/k8s-manager" }
templatizer = { path = "src/lib/rust/templatizer" }
wait-for-port = { path = "src/lib/rust/wait-for-port" }
nix-container-builder = { path = "src/lib/rust/nix-container-builder" }
workspace-embed = { path = "src/lib/rust/workspace-embed" }

# API Server sub-crates
firestream-api-server-cli = { path = "src/lib/rust/firestream-api-server/cli" }
firestream-api-server-config = { path = "src/lib/rust/firestream-api-server/config" }
firestream-api-server-db = { path = "src/lib/rust/firestream-api-server/db" }
firestream-api-server-web = { path = "src/lib/rust/firestream-api-server/web" }
firestream-api-server-macros = { path = "src/lib/rust/firestream-api-server/macros" }

comfy-table = "7.1.4"



# Standard Library
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
globset = "0.4"
bstr = "1.0"
futures-util = "0.3.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.10", features = ["v4"] }
include_dir = { version = "0.7.4" }

toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

directories = "5"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.31"
bollard = "0.17"
which = "6.0"
indoc = "2.0"
futures = "0.3"
semver = "1.0"
whoami = "1.5"
dirs = "6.0.0"
async-trait = "0.1"
tempfile = "3.8"
tera = "1.20"
dialoguer = "0.11"
once_cell = "1.19"
serde_yaml = "0.9"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tiny_http = "0.12"
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"


# Terminal User Interface (TUI) / Command Line Interface (CLI)
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
color-eyre = "0.6.3"
thiserror = "1.0"

# Kubernetes
kube = { version = "1.1.0", features = ["runtime", "derive"] }
# The feature flag must match the version of kubernetes that is the target
# K3D is provided
k8s-openapi = { version = "0.25", features = ["v1_31"] }




