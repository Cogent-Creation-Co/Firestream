[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# MUST NOT be "firestream-odoo": that is the base workspace's member name, and
# Firestream throws on a member-name collision in pythonWorkspace.extend.
name = "odoo-addons-deps"
version = "0.1.0"
description = "Python packages the example Odoo addons import in-process (merged into the firestream-odoo:18.0 venv)"
# MUST admit 3.12: Firestream's factory (python-workspace.nix) throws if the
# effective interpreter (Odoo 18's python312) does not satisfy this constraint.
requires-python = ">=3.12,<3.13"
dependencies = [
    # In-process libraries an Odoo addon imports (reportlab renderPM backend,
    # cairo bindings, freetype bindings). pycairo is sdist-only on Linux and
    # builds with meson-python; overrides.nix supplies the backend, because the
    # pinned uv2nix does not read [tool.uv.extra-build-dependencies].
    "pycairo>=1.27",
    "rlPyCairo>=0.3",
    "freetype-py>=2.5",
    # plaid-python is deliberately NOT listed: Firestream's odoo/18 lock already
    # pins it. Redeclaring it here would couple this lock to Firestream's pin and
    # trip the lock-compatibility guard the moment Firestream bumps it.
]

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_addons_deps"]
