{{- if .Values.deployment.envoy.enabled -}}
{{- if .Values.serviceAccount.envoy.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.envoy.serviceAccountName" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.envoy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
