{{- if not .Values.secret.supabase.secretRef }}
{{- $required := list "POSTGRES_PASSWORD" "JWT_SECRET" "ANON_KEY" "SERVICE_ROLE_KEY" "JWT_JWKS" "JWT_KEYS" "SECRET_KEY_BASE" "REALTIME_DB_ENC_KEY" "VAULT_ENC_KEY" "PG_META_CRYPTO_KEY" "DASHBOARD_PASSWORD" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "supabase.secret.supabase" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := $required }}
  {{ $key }}: {{ required (printf "secret.supabase.values.%s is required when secret.supabase.secretRef is empty" $key) (index $.Values.secret.supabase.values $key) | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secret.supabase.values }}
  {{- if not (has $key $required) }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
