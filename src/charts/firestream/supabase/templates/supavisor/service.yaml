{{- if .Values.deployment.supavisor.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.supavisor.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
    app.kubernetes.io/component: supavisor
spec:
  type: {{ .Values.service.supavisor.type }}
  ports:
    - port: {{ .Values.service.supavisor.port }}
      targetPort: 4000
      protocol: TCP
      name: http
    - port: {{ .Values.service.supavisor.sessionPort }}
      targetPort: 5432
      protocol: TCP
      name: session
    - port: {{ .Values.service.supavisor.transactionPort }}
      targetPort: 6543
      protocol: TCP
      name: transaction
  selector:
    {{- include "supabase.supavisor.selectorLabels" . | nindent 4 }}
{{- end }}
