{{- if .Values.deployment.supavisor.enabled -}}
{{- if .Values.serviceAccount.supavisor.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supabase.supavisor.serviceAccountName" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.supavisor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
