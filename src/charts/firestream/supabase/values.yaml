## Extra environment per component: a list of { name, value } or
## { name, valueFrom } entries. The images carry their own defaults.
environment:
  db: []
  auth:
    - name: API_EXTERNAL_URL
      value: "http://localhost:8000/auth/v1"
    - name: GOTRUE_SITE_URL
      value: "http://localhost:3000"
    - name: GOTRUE_MAILER_AUTOCONFIRM
      value: "true"
  rest: []
  realtime: []
  supavisor: []
  meta: []
  storage:
    - name: GLOBAL_S3_ENDPOINT
      value: "http://seaweedfs-all-in-one.seaweedfs.svc.cluster.local:8333"
    - name: GLOBAL_S3_BUCKET
      value: "supabase-storage"
    - name: GLOBAL_S3_FORCE_PATH_STYLE
      value: "true"
    - name: REGION
      value: "us-east-1"
    - name: STORAGE_S3_REGION
      value: "us-east-1"
    - name: STORAGE_PUBLIC_URL
      value: "http://localhost:8000"
  imgproxy: []
  studio:
    - name: SUPABASE_PUBLIC_URL
      value: "http://localhost:8000"
  envoy:
    - name: SUPABASE_PUBLIC_URL
      value: "http://localhost:8000"

persistence:
  db:
    enabled: true
    storageClassName: ""
    annotations: {}
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  ## imgproxy reads from the Storage S3 backend; no volume by default.
  imgproxy:
    enabled: false
    storageClassName: ""
    annotations: {}
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  studio:
    enabled: true
    storageClassName: ""
    annotations: {}
    size: 1Gi
    accessModes:
      - ReadWriteOnce

service:
  db:
    type: ClusterIP
    port: 5432
  auth:
    type: ClusterIP
    port: 9999
  rest:
    type: ClusterIP
    port: 3000
  realtime:
    type: ClusterIP
    port: 4000
  supavisor:
    type: ClusterIP
    port: 4000
    sessionPort: 5432
    transactionPort: 6543
  meta:
    type: ClusterIP
    port: 8080
  storage:
    type: ClusterIP
    port: 5000
  imgproxy:
    type: ClusterIP
    port: 5001
  studio:
    type: ClusterIP
    port: 3000
  envoy:
    type: ClusterIP
    port: 8000

