## Supabase Helm chart (Firestream fork)
##
## Forked from supabase-community/supabase-kubernetes (Apache-2.0) at commit
## 8d4b5cda901a3f28535af5c79c5ed95e884e48d9 (chart version 0.8.0). See LICENSE.
##
## Firestream changes against upstream:
## - Every image is a Firestream-built image (packages.supabase-*); each pod
##   runs firestream-healthd on port 9180, and /readyz is the readiness probe.
## - Envoy (supabase-envoy) replaces Kong. Supavisor is added.
## - Removed: edge functions, analytics (Logflare), vector, MinIO, the helm
##   test hooks and the upstream initdb SQL. The db image runs the Supabase
##   migrations itself.
## - One key Secret in the `supabase-keygen --output k8s-secret` layout
##   replaces the per-domain jwt/apikey/db/dashboard/meta/realtime secrets.
## - Storage always uses S3; by default the SeaweedFS chart of the
##   firestreamStacks.supabase stack.
##
## Configuration is grouped by domain, as upstream:
##  1. secret  2. deployment  3. image  4. environment  5. persistence
##  6. service  7. autoscaling  8. ingress  9. serviceAccount
## 10. networkPolicy  11. migration

