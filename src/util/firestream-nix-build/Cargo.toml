[package]
name = "firestream-nix-build"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# NOT `license.workspace = true`. This crate is a derivative work of the
# MIT-licensed Mic92/nix-fast-build (Python); the port's own modifications are
# Apache-2.0 like the rest of the `src/util/` subtree. Both notices are
# retained (`LICENSE-MIT` here, `../LICENSE` for the subtree). See FORK.md.
license = "Apache-2.0 AND MIT"
description = "Rust port of nix-fast-build with in-process OpenTelemetry ingest (PRD §9.2)"
repository.workspace = true
readme = "README.md"

[[bin]]
name = "firestream-nix-build"
path = "src/main.rs"

[lib]
name = "firestream_nix_build"
path = "src/lib.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Async runtime
tokio = { version = "1.40", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "time",
    "fs",
    "io-util",
    "sync",
    "net",
] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }

# Serde / JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JUnit XML
quick-xml = { version = "0.36", features = ["serialize"] }

# Errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
] }

# Utilities
shlex = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# In-process OTel ingest. Linked statically; no subprocess per build.
firestream-otel-cli = { path = "../firestream-otel-cli" }

# Unix-specific for signal handling (SIGTERM/SIGKILL in ensure_stop)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
